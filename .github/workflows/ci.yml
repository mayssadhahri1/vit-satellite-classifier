name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: PyTorch (version CPU, plus légère)
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Dépendances
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests (mini-ViT, sans téléchargement)
        run: pytest -q
